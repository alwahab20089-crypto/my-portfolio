services:
  backend:
    build:
      context: ../..
      dockerfile: devops/docker/backend.Dockerfile
    container_name: my-portfolio-backend
    ports:
      - "5000:5000"
    env_file:
      - ../../backend/.env
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

  frontend:
    build:
      context: ../..
      dockerfile: devops/docker/frontend.Dockerfile
      args:
        VITE_API_URL: http://localhost:5000
    container_name: my-portfolio-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
