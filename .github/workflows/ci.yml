name: CI

on:
  push:
    branches:
      - devops
  pull_request:
    branches:
      - devops

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Create CI environment file
        run: |
          mkdir -p backend
          printf 'EMAIL_USER=ci@example.com\nEMAIL_PASS=ci-test-password\n' > backend/.env
      - name: Build Docker images
        run: |
          docker compose -f devops/compose/docker-compose.yml build

      - name: Start Docker Compose
        run: |
          docker compose -f devops/compose/docker-compose.yml up -d

      - name: Check running containers
        run: |
          docker compose -f devops/compose/docker-compose.yml ps

      - name: Check backend health
        run: |
          curl --fail http://localhost:5000/health

      - name: Show container logs on failure
        if: failure()
        run: |
          docker compose -f devops/compose/docker-compose.yml logs

      - name: Stop Docker Compose
        if: always()
        run: |
          docker compose -f devops/compose/docker-compose.yml down
